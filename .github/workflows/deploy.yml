name: Deploy SIGIR 2025 Papers Site

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Create environment configuration
      run: |
        echo "Creating config.js with environment variables"
        cat > config.js << EOF
        // Environment configuration - generated during deployment
        window.SIGIR_CONFIG = {
          SUPABASE_URL: '${{ secrets.SUPABASE_URL }}',
          SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}',
          // Test users (for demo purposes only)
          TEST_USERS: [
            { email: '${{ secrets.TEST_USER_1_EMAIL }}', password: '${{ secrets.TEST_USER_1_PASSWORD }}' },
            { email: '${{ secrets.TEST_USER_2_EMAIL }}', password: '${{ secrets.TEST_USER_2_PASSWORD }}' },
            { email: '${{ secrets.TEST_USER_3_EMAIL }}', password: '${{ secrets.TEST_USER_3_PASSWORD }}' },
            { email: '${{ secrets.TEST_USER_4_EMAIL }}', password: '${{ secrets.TEST_USER_4_PASSWORD }}' },
            { email: '${{ secrets.TEST_USER_5_EMAIL }}', password: '${{ secrets.TEST_USER_5_PASSWORD }}' },
            { email: '${{ secrets.TEST_USER_6_EMAIL }}', password: '${{ secrets.TEST_USER_6_PASSWORD }}' }
          ]
        };
        EOF
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        exclude_assets: '.github,*.md,supabase_schema.sql,.env*'