<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGIR 2025 Papers - README Collection</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <!-- Meta Tags -->
    <meta name="description" content="Browse and explore research papers from SIGIR 2025 with interactive README documentation">
    <meta name="author" content="SIGIR 2025 Papers Collection">
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="SIGIR 2025 Papers - README Collection">
    <meta property="og:description" content="Interactive collection of SIGIR 2025 research papers with voting and search functionality">
    <meta property="og:type" content="website">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#667eea">
</head>

<body>
    <div class="container">
        <!-- Header Section -->
        <header>
            <h1>SIGIR 2025 Papers</h1>
            <p class="subtitle">README Documentation Collection</p>
        </header>
        
        <!-- Search Section -->
        <div class="search-box">
            <input 
                type="text" 
                class="search-input" 
                placeholder="Search papers by title or content..." 
                id="searchInput"
                aria-label="Search papers"
            >
        </div>
        
        <!-- Authentication Section -->
        <div id="authContainer" class="auth-container">
            <div id="authFeedback" class="auth-feedback" role="alert"></div>
            
            <div id="loginForm" class="login-form">
                <h3>Sign in to vote on papers</h3>
                <form id="authForm" novalidate>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Email" 
                        required 
                        autocomplete="email"
                        aria-label="Email address"
                    >
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Password" 
                        required 
                        autocomplete="current-password"
                        aria-label="Password"
                    >
                    <button type="submit" class="auth-btn" id="signInBtn">
                        Sign In
                    </button>
                </form>
            </div>
            
            <div id="userInfo" class="user-info" style="display: none;" role="status"></div>
            
            <!-- Loading Overlay -->
            <div class="loading-overlay" id="authLoadingOverlay" aria-hidden="true">
                <div class="spinner show"></div>
                <div class="loading-text">Authenticating...</div>
            </div>
        </div>
        
        <!-- Statistics -->
        <div class="stats" id="stats" role="status">Loading papers...</div>
        
        <!-- Papers Grid -->
        <main>
            <div class="papers-grid" id="papersGrid" role="main" aria-live="polite">
                <div class="loading">Loading papers...</div>
            </div>
        </main>
    </div>
    
    <!-- Modal -->
    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true"></div>
    <div 
        class="modal-content" 
        id="modalContent" 
        role="dialog" 
        aria-labelledby="modalTitle" 
        aria-hidden="true"
    >
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Paper Title</h2>
            <button 
                class="modal-close" 
                id="modalClose" 
                aria-label="Close modal (Press Escape)"
            >
                Close (ESC)
            </button>
        </div>
        <div class="modal-body" id="modalBody">
            <!-- README content will be inserted here -->
        </div>
    </div>
    
    <!-- External Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Legacy compatibility scripts (for production) -->
    <script src="load-env.js"></script>
    
    <!-- Modular Application Scripts -->
    <script src="assets/js/debug.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/supabase-voting.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/papers.js"></script>
    <script src="assets/js/app.js"></script>
    
    <!-- Test Suite (development only) -->
    <script src="assets/js/tests.js"></script>
    
    <!-- Service Worker Registration (optional) -->
    <script>
        // Register service worker if available (for offline support in the future)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                // Uncomment when service worker is implemented
                // navigator.serviceWorker.register('/sw.js');
            });
        }
        
        // Performance monitoring
        if ('performance' in window) {
            window.addEventListener('load', () => {
                const loadTime = performance.now();
                console.log(`📊 Page loaded in ${Math.round(loadTime)}ms`);
            });
        }
    </script>
</body>
</html>
