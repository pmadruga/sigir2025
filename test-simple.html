<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Modal Test</title>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Atkinson Hyperlegible', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .test-card {
            background: white;
            padding: 20px;
            margin: 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .test-card:hover {
            transform: translateY(-5px);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 80%;
            max-width: 800px;
            height: 80vh;
            background: white;
            border-radius: 12px;
            padding: 30px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        
        .modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .modal-content {
            flex: 1;
            overflow-y: auto;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        
        button:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <h1 style="color: white; text-align: center;">Simple Modal Test</h1>
    
    <div class="test-card" onclick="openModal()">
        <h2>Click me to open modal</h2>
        <p>This is a test card. Click to see if the modal opens correctly.</p>
    </div>
    
    <div class="modal-overlay" id="overlay" onclick="closeModal()"></div>
    
    <div class="modal" id="modal">
        <div class="modal-header">
            <h2>Test Modal</h2>
            <button onclick="closeModal()">Close</button>
        </div>
        <div class="modal-content">
            <h3>Modal is working!</h3>
            <p>If you can see this, the modal system is functioning correctly.</p>
            <p>The Atkinson Hyperlegible font should be visible here.</p>
            <p>Press ESC or click outside to close.</p>
        </div>
    </div>
    
    <script>
        function openModal() {
            console.log('Opening modal...');
            document.getElementById('overlay').classList.add('active');
            document.getElementById('modal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }
        
        function closeModal() {
            console.log('Closing modal...');
            document.getElementById('overlay').classList.remove('active');
            document.getElementById('modal').classList.remove('active');
            document.body.style.overflow = '';
        }
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        console.log('Simple modal test loaded');
    </script>
</body>
</html>
